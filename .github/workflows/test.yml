name: test
on: [push, pull_request]
permissions: { contents: read }
jobs:
  test:
    # 22.18.0 is the first Node with type stripping on by default: nothing older is supported
    strategy: { matrix: { node: ["22.18.0", "24"] } }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "${{ matrix.node }}" }
      - run: node scripts/validate-manifest.ts
      - run: node scripts/generate-defaults.ts --check
      - run: bash -n hooks/run-node.sh
      - run: node scripts/check-english.ts
      # always with the glob: without arguments node --test also runs the helpers as main
      - run: node --test "tests/**/*.test.ts"
