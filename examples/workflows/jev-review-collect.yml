# jev-review, first phase: collects the pull request number and its diff, with no secret
# and without running any code of the pull request. On a pull request from a fork its
# author can rewrite this very file, so the second phase treats whatever it produces as
# hostile: the artifact is only a cross-check, and the reviewed diff comes from the API.
# Copy both files into .github/workflows/ of your repository.
name: jev-review (collect)
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # the event's strings reach the script only through env, never through ${{ }}
      - name: Number, SHAs and diff (no secret, no code of the pull request run)
        env:
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p jev-input
          printf '{"schema":1,"pr":%d,"base_sha":"%s","head_sha":"%s"}\n' "$PR" "$BASE" "$HEAD" > jev-input/pr.json
          git -c core.fsmonitor=false -c core.hooksPath=/dev/null -c diff.external= \
            diff --no-ext-diff --no-textconv --no-color -M "$BASE...$HEAD" > jev-input/diff.patch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jev-review-input
          path: jev-input/
          retention-days: 3
          if-no-files-found: error
