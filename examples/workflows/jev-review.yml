# jev-review, second phase: runs from the default branch, with the secrets, when the first
# phase completes. It never checks out the pull request's code: the checkout below is the
# default branch, read only for the rules in .jev-hooks/. The action finds the pull
# request from the trusted workflow_run payload, reviews the diff GitHub's API gives for
# the two SHAs, and always publishes a completed "jev-review" check run.
#
# Repository settings: variable JEV_URL (the backend's base URL), optionally JEV_MODEL;
# secret JEV_API_KEY when the backend needs a key. For a backend on your tailnet, set
# the variable JEV_TAILSCALE to true and the two TS_OAUTH_* secrets (an ephemeral node
# tagged tag:ci, with an ACL that reaches only the backend's port). For a required check
# a fork cannot imitate, set the variable JEV_APP_CLIENT_ID and the secret
# JEV_APP_PRIVATE_KEY of a dedicated GitHub App (permission Checks: read and write, no
# webhook, installed on this repository), and require "jev-review" from that app in
# branch protection (README → GitHub Action).
name: jev-review
on:
  workflow_run:
    workflows: ["jev-review (collect)"]
    types: [completed]
permissions:
  contents: read
  pull-requests: read
  checks: write
  actions: read
concurrency:
  group: jev-review-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false        # rizzo does not cancel abandoned requests: do not queue duplicates
jobs:
  review:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, default branch: .jev-hooks/ only
        with: { persist-credentials: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true                  # a missing artifact becomes a failure check, with the reason
        with:
          name: jev-review-input
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/jev-input
      - if: vars.JEV_TAILSCALE == 'true'
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      # Only with a dedicated app: its token creates the check run, so a job named
      # jev-review in a fork cannot stand in for it. Without it, the Actions token does.
      - id: app
        if: vars.JEV_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.JEV_APP_CLIENT_ID }}
          private-key: ${{ secrets.JEV_APP_PRIVATE_KEY }}
          permission-checks: write
      # A commit SHA, never a branch: this step holds the key. Replace it with the SHA of
      # the jev-hooks release you have read.
      - uses: 7hemas7er/jev-hooks@0f30d9fdb22948a76462e342e9b3b115e2876141 # 0.6.0
        with:
          input-dir: ${{ runner.temp }}/jev-input
          url: ${{ vars.JEV_URL }}
          api-key: ${{ secrets.JEV_API_KEY }}
          model: ${{ vars.JEV_MODEL || 'jev-latest' }}
          github-token: ${{ github.token }}
          # empty without the app step: the action then uses github-token
          checks-token: ${{ steps.app.outputs.token }}
